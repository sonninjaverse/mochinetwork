[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# Deploy.s.sol reads the depth-0 seed list. Foundry blocks filesystem access
# unless it is granted explicitly, and this grants only that one file.
fs_permissions = [{ access = "read", path = "./seeds.json" }]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"

[fmt]
line_length = 100
